<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png">
<title>Relatório do mini diagnóstico | RiseUp Odonto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; background: #e3e9e9; font-family: "Archivo", sans-serif; color: #141414; font-size: 11pt; line-height: 1.5; }
h1, h2, h3 { font-family: "Poppins", sans-serif; font-weight: 500; margin: 0; line-height: 1.2; }
p { margin: 0; }
.barra-topo { position: sticky; top: 0; z-index: 5; background: #141414; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.barra-topo button { background: #29d9d5; color: #141414; border: 0; border-radius: 999px; padding: 10px 22px; font: inherit; font-weight: 500; cursor: pointer; }
.barra-topo span { color: #b9c4c4; }
.pg { width: 210mm; min-height: 297mm; margin: 24px auto; background: #fff; padding: 15mm 16mm 11mm; display: flex; flex-direction: column; gap: 5mm; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.capa { background: #141414; color: #fff; padding: 22mm 20mm 16mm; }
.circ { position: absolute; border-radius: 50%; border: 1px solid rgba(41,217,213,.3); }
.topo { display: flex; justify-content: space-between; align-items: center; font-size: 10pt; color: #4a5252; border-bottom: 1px solid #e3e9e9; padding-bottom: 4mm; }
.capa .topo { border: 0; color: #b9c4c4; }
.topo img { height: 9mm; display: block; }
.sobre { font-size: 10.5pt; font-weight: 500; color: #0b7a77; }
.capa .sobre { color: #29d9d5; letter-spacing: .06em; }
.capa h1 { font-size: 38pt; margin-top: 3mm; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4mm; }
.cards div { border: 1px solid #2f3535; border-radius: 5mm; padding: 4.5mm 4mm; min-width: 0; display: flex; flex-direction: column; gap: 1.5mm; background: rgba(20,20,20,.75); }
.cards small { color: #b9c4c4; font-size: 9pt; }
.cards b { font-family: "Poppins", sans-serif; font-weight: 500; font-size: 12.5pt; }
.cards b.c { color: #29d9d5; }
.brilho { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(41,217,213,.24), rgba(41,217,213,0) 68%); }
.rodape span:last-child { white-space: nowrap; }
.rodape { margin-top: auto; display: flex; justify-content: space-between; gap: 6mm; font-size: 8pt; color: #4a5252; border-top: 1px solid #e3e9e9; padding-top: 3mm; }
.capa .rodape { border-color: #2f3535; color: #b9c4c4; font-size: 9pt; }
.faixa { background: #f4f7f7; border-radius: 4mm; padding: 4mm 5mm; display: flex; flex-direction: column; gap: 1mm; }
.faixa span { font-size: 8.5pt; font-weight: 500; color: #0b7a77; letter-spacing: .06em; }
.faixa h2 { font-size: 19pt; }
.medidor { width: 62mm; height: auto; }
.legenda { display: flex; gap: 6mm; font-size: 8.5pt; color: #4a5252; }
.legenda i { display: inline-block; width: .8mm; height: 3.5mm; background: #141414; margin-right: 1.5mm; vertical-align: -0.6mm; }
.legenda i.top { background: #b9c4c4; }
.e6 { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5mm; }
.e6 > div { border: 1px solid #e3e9e9; border-radius: 4mm; padding: 3.5mm 4mm; display: flex; flex-direction: column; gap: 1.8mm; break-inside: avoid; }
.e6 > div.fraca { border-color: #0b7a77; box-shadow: inset 0 0 0 .3mm #0b7a77; }
.e6 .t1 { display: flex; justify-content: space-between; align-items: center; gap: 2mm; }
.e6 .t1 b { font-weight: 500; font-size: 10.5pt; }
.e6 .lt { font-size: 8.5pt; color: #4a5252; }
.e6 p { font-size: 8.8pt; line-height: 1.4; color: #4a5252; }
.e6 p b { color: #141414; font-weight: 500; }
.e6 p b.ce { color: #0b7a77; }
.tr { position: relative; height: 2.4mm; border-radius: 999px; background: #e3e9e9; margin: 1mm 0; }
.tr i { display: block; height: 100%; border-radius: 999px; }
.tr em { position: absolute; top: -1.2mm; width: .7mm; height: 4.8mm; background: #141414; }
.tr em.top { background: #b9c4c4; }
.selo { justify-self: start; font-size: 7.5pt; font-weight: 500; border-radius: 999px; padding: .8mm 2.6mm; white-space: nowrap; }
.s-ok { background: #e3f8f7; color: #085e5b; } .s-atencao { background: #fff1df; color: #8a4a0b; } .s-critico { background: #ffe9e6; color: #a1241a; } .s-nao { background: #f4f7f7; color: #4a5252; }
.resumo { background: #141414; color: #e3e9e9; border-radius: 4mm; padding: 4mm 5mm; font-size: 9.5pt; }
.resumo b { color: #29d9d5; font-weight: 500; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3.5mm; }
.kpis div { background: #f4f7f7; border-radius: 4mm; padding: 4mm; display: flex; flex-direction: column; gap: 1mm; }
.kpis div.esc { background: #141414; color: #fff; }
.kpis small { font-size: 8.5pt; color: #4a5252; }
.kpis .esc small { color: #b9c4c4; }
.kpis b { font-family: "Poppins", sans-serif; font-weight: 500; font-size: 15pt; line-height: 1.2; }
.kpis .esc b { color: #29d9d5; }
.sub { font-size: 11pt; font-weight: 500; }
.plano { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.5mm; }
.plano div { border: 1px solid #e3e9e9; border-radius: 4mm; padding: 4mm; display: flex; flex-direction: column; gap: 1.5mm; font-size: 10pt; }
.plano small { font-size: 8.5pt; font-weight: 500; color: #0b7a77; }
.ferr { display: flex; flex-direction: column; gap: 2.5mm; font-size: 9.8pt; }
.ferr h4 { margin: 1.5mm 0 0; font-size: 9.8pt; font-weight: 500; color: #0b7a77; }
.ferr .script { border: 1px solid #e3e9e9; border-radius: 3mm; padding: 3mm 3.5mm; break-inside: avoid; color: #4a5252; }
.ferr .copy, .ferr #baixar-planilha, .ferr button { display: none; }
.ferr .tool-rule { color: #4a5252; }
.ferr .steps { margin: 0; padding-left: 5mm; display: flex; flex-direction: column; gap: 2mm; color: #4a5252; }
.ferr .steps strong { color: #141414; font-weight: 500; }
.tranca { border: 1px solid #e3e9e9; border-radius: 4mm; padding: 3mm 4mm; display: flex; gap: 4mm; align-items: center; }
.tranca .ico { width: 10mm; height: 10mm; border-radius: 3mm; background: #141414; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tranca .ico svg { width: 5mm; height: 5mm; fill: none; stroke: #29d9d5; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tranca b { font-weight: 500; font-size: 10.5pt; }
.tranca p { font-size: 9pt; color: #4a5252; }
.tranca .bl { margin-left: auto; display: flex; flex-direction: column; gap: 1.5mm; }
.tranca .bl i { display: block; height: 2.4mm; border-radius: 999px; background: #e3e9e9; width: 20mm; }
.tranca .bl i + i { width: 12mm; }
.convite { position: relative; overflow: hidden; background: #141414; color: #fff; border-radius: 5mm; padding: 6mm; display: flex; flex-direction: column; gap: 3mm; }
.convite > * { position: relative; }
.convite h3 { font-size: 17pt; line-height: 1.25; }
.convite h3 span { color: #29d9d5; }
.convite p { color: #e3e9e9; font-size: 10pt; }
.convite a { align-self: flex-start; background: #29d9d5; color: #141414; text-decoration: none; font-weight: 500; border-radius: 999px; padding: 3mm 6mm; font-size: 10.5pt; }
@media print {
  body { background: #fff; }
  .barra-topo { display: none; }
  .pg { margin: 0; box-shadow: none; page-break-after: always; }
  .pg:last-child { page-break-after: auto; }
}
@media screen and (max-width: 820px) {
  .pg { width: auto; min-height: 0; margin: 12px; padding: 22px 18px; }
  .cards, .plano, .e6, .kpis { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="barra-topo"><span>Para enviar: clique em "Salvar em PDF", escolha "Salvar como PDF", margens "Nenhuma" e marque "Gráficos de plano de fundo".</span><button type="button" onclick="window.print()">Salvar em PDF</button></div>
<div id="paginas"></div>

<script src="/assets/config.js"></script>
<script src="/assets/calc.js"></script>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const alvo = document.getElementById("paginas");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const a = (p.get("r") || "").split("").map(Number);
  if (!RU.validar(a)) { alvo.innerHTML = `<div class="pg"><h2>Relatório não encontrado</h2><p>O link parece incompleto.</p></div>`; return; }

  const faixa = Object.keys(RU.FAIXAS)[Number(p.get("f"))] || "";
  const r = RU.calcular(a, { faixa });
  const clinica = (p.get("n") || "").slice(0, 120) || "[Nome da clínica]";
  const dataTxt = new Date().toLocaleDateString("pt-BR", { day: "numeric", month: "long", year: "numeric" });
  const k = (v) => Math.round(v / 1000).toLocaleString("pt-BR");
  const nomeEtapa = r.naoMede ? "Não mede o funil" : r.etapaNome;
  const ganho = r.modo === "top" ? r.ganhoTop : r.estimativa;
  const temGanho = r.hoje !== null && ganho > 0;

  const topo = `<div class="topo"><img src="/assets/logo.png" alt="RiseUp Odonto"><span>${esc(clinica)}</span></div>`;
  const rodape = (n) => `<div class="rodape"><span>Referências: Liine (2024); revisão científica sobre faltas (2018); Henry Schein One (2026); Harvard Business Review (2011). Estimativa com os dados informados; não é promessa de resultado.</span><span>Página ${n}</span></div>`;
  const faixaTit = (a, b) => `<div class="faixa"><span>${a}</span><h2>${b}</h2></div>`;
  const arco = Math.round(251 * r.nota / 100);
  const medidor = `<svg class="medidor" viewBox="0 0 200 118" role="img" aria-label="Nota do funil: ${r.nota} de 100"><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#2a3030" stroke-width="14" stroke-linecap="round"></path><path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#29d9d5" stroke-width="14" stroke-linecap="round" stroke-dasharray="${arco} 300"></path><text x="100" y="88" text-anchor="middle" font-family="Poppins, sans-serif" font-size="42" fill="#fff">${r.nota}</text><text x="100" y="110" text-anchor="middle" font-family="Archivo, sans-serif" font-size="12" fill="#b9c4c4">de 100</text></svg>`;
  const notaTxt = r.notaTexto.charAt(0).toUpperCase() + r.notaTexto.slice(1);
  const fraca = r.naoMede ? "" : r.etapa;

  const capa = `
  <section class="pg capa">
    <span class="brilho" style="width:170mm;height:170mm;right:-70mm;top:-60mm"></span>
    <span class="circ" style="width:130mm;height:130mm;left:-75mm;bottom:-95mm;border-color:rgba(11,122,119,.6)"></span>
    <div class="topo" style="position:relative"><img src="/assets/logo-branca.png" alt="RiseUp Odonto"><span>${dataTxt}</span></div>
    <div style="margin-top:26mm;display:flex;flex-direction:column;gap:4mm;position:relative">
      <span class="sobre">RELATÓRIO DO MINI DIAGNÓSTICO</span>
      <h1 style="font-size:34pt">Diagnóstico da<br><span style="color:#29d9d5">${esc(clinica)}</span></h1>
    </div>
    <div style="display:flex;align-items:center;gap:8mm;margin-top:8mm;position:relative">${medidor}<div style="display:flex;flex-direction:column;gap:2mm"><span class="sobre" style="font-size:9pt">NOTA DO FUNIL</span><span style="color:#e3e9e9;font-size:11.5pt;max-width:70mm">${esc(notaTxt)}</span></div></div>
    <div class="cards" style="margin-top:auto;position:relative">
      <div><small>Etapa mais fraca</small><b>${esc(nomeEtapa)}</b></div>
      <div><small>${r.modo === "top" ? "Nível das melhores" : "Chegando à média"}</small><b class="c">${temGanho ? `+R$ ${k(ganho)} mil/mês` : "Calcular na reunião"}</b></div>
      <div><small>Em um ano</small><b>${temGanho ? `+R$ ${k(ganho * 12)} mil` : "—"}</b></div>
    </div>
    <div class="rodape" style="position:relative;margin-top:0"><span>Preparado por <b style="color:#fff;font-weight:500">${esc(RU_CONFIG.conta(p.get("v")).nome)} · RiseUp Odonto</b></span><span>Sistema de captação, conversão e retenção</span></div>
  </section>`;

  const cardsEtapas = r.status.map((s, i) => `
    <div class="${s.chave === fraca ? "fraca" : ""}">
      <div class="t1"><b>${i + 1}. ${s.nome}</b><span class="selo s-${s.s}">${s.situacao}</span></div>
      <span class="lt">${esc(s.leitura)}${s.chave === fraca ? " · <b style=\"color:#0b7a77;font-weight:500\">etapa mais fraca</b>" : ""}</span>
      ${s.valor !== undefined && s.valor !== null ? `<div class="tr"><i style="width:${Math.round(s.valor * 100)}%;background:${s.s === "critico" ? "#f2a33a" : "#29d9d5"}"></i><em style="left:${Math.round(s.media * 100)}%"></em>${s.top ? `<em class="top" style="left:${Math.round(s.top * 100)}%"></em>` : ""}</div><span class="lt">Média ${RU.pct(s.media)}${s.top ? ` · melhores ${RU.pct(s.top)}` : ""}</span>` : ""}
      <p><b>O que acontece:</b> ${esc(s.problema)}</p>
      <p><b class="ce">O que fazer:</b> ${esc(s.fazer)}</p>
    </div>`).join("");
  const resumoTxt = temGanho
    ? `Hoje, os contatos novos geram cerca de <b>R$ ${k(r.hoje)} mil por mês</b>. ${r.modo === "top" ? "No nível das melhores clínicas no fechamento" : "Chegando à média do mercado"}, seriam cerca de <b>R$ ${k(r.hoje + ganho)} mil</b>.${r.cruzamento ? " " + esc(r.cruzamento) : ""}`
    : esc(r.cruzamento || r.abertura);
  const pagina2 = `
  <section class="pg">
    ${topo}
    ${faixaTit("AS 6 ETAPAS DA SUA CLÍNICA", "Onde os pacientes se perdem hoje")}
    <div class="legenda"><span><i></i>Média do mercado</span><span><i class="top"></i>Melhores clínicas</span></div>
    <div class="e6">${cardsEtapas}</div>
    <div class="resumo">${resumoTxt}</div>
    ${rodape(2)}
  </section>`;

  const d = r.detalhe;
  const kpis = d ? `<div class="kpis">
      <div class="esc"><small>${d.custo ? d.custoRot : "Etapa mais fraca"}</small><b>${d.custo ? `+R$ ${k(d.custo)} mil/mês` : esc(nomeEtapa)}</b></div>
      <div><small>${d.rotulo}</small><b>${d.n.toLocaleString("pt-BR")}</b></div>
      <div><small>Sua taxa · média</small><b>${RU.pct(d.taxa)} · ${RU.pct(d.media)}</b></div>
    </div>` : "";
  const pagina3 = `
  <section class="pg">
    ${topo}
    ${faixaTit(r.naoMede ? "O PRINCIPAL ACHADO" : "SUA ETAPA MAIS FRACA", esc(nomeEtapa))}
    ${kpis}
    <p style="font-size:10pt;color:#4a5252"><b style="color:#141414;font-weight:500">Por que pesa mais:</b> ${esc(r.abertura)}</p>
    <span class="sub">${esc(r.ferramenta)}</span>
    <div class="ferr">${r.ferramentaHtml}</div>
    ${rodape(3)}
  </section>`;

  const cad = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const trancados = [
    ["Orçamentos parados", "Quantos existem hoje e quanto valem em tratamentos."],
    ["Origem dos pacientes que fecham", "De onde vêm os contatos que viram tratamento e os que só custam."],
    ["Custo de cada paciente novo", "Quanto a clínica investe para cada paciente que chega à cadeira."],
  ];
  const pagina4 = `
  <section class="pg">
    ${topo}
    ${faixaTit("PLANO DE 4 SEMANAS", "Um passo por semana")}
    <div class="plano">${r.plano.map((t, i) => `<div><small>Semana ${i + 1}</small><span>${esc(t)}</span></div>`).join("")}</div>
    <span class="sub" style="margin-top:2mm">O que só os números reais da clínica mostram</span>
    <p style="font-size:9.5pt;color:#4a5252;margin-top:-3mm">Este diagnóstico usa as respostas que você deu. Com os dados da clínica, aparecem as respostas que mais mudam o plano:</p>
    ${trancados.map((t) => `<div class="tranca"><span class="ico">${cad}</span><div><b>${t[0]}</b><p>${t[1]}</p></div><span class="bl"><i></i><i></i></span></div>`).join("")}
    <div class="convite">
      <span class="brilho" style="width:70mm;height:70mm;right:-22mm;top:-22mm;position:absolute"></span>
      <h3>Vamos aprofundar o diagnóstico da <span>${esc(clinica)}</span>?</h3>
      <p>Na reunião, analisamos com você cada etapa do atendimento da clínica, encontramos a causa de cada perda e, no final, apresentamos um caminho para corrigir.</p>
      <a href="${esc(RU_CONFIG.agendaUrl(p.get("n") || "", nomeEtapa, p.get("v")))}">Quero aprofundar meu diagnóstico</a>
    </div>
    ${rodape(4)}
  </section>`;

  alvo.innerHTML = capa + pagina2 + pagina3 + pagina4;
  document.title = `Relatório · ${clinica} | RiseUp Odonto`;
})();
</script>
</body>
</html>
