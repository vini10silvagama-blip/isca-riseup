<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Diagnóstico do vazamento | RiseUp Odonto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Poppins:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="quiz">
<header class="topo"><div class="wrap"><a class="logo" href="/guia" id="voltar-guia"><img class="logo-full" src="/assets/logo.png" alt="RiseUp Odonto" width="138" height="40"><img class="logo-simb" src="/assets/simbolo.png" alt="RiseUp Odonto" width="34" height="34"></a></div></header>

<main class="wrap" id="tela"></main>

<script src="/assets/calc.js"></script>
<script src="/assets/app.js"></script>
<script>
(function () {
  let leadId = RUApp.lead();
  // Só manda para a captura quem nunca passou por ela neste aparelho.
  if (!leadId && !RUApp.lerLocal("ru_nome")) { location.replace("/?next=quiz"); return; }
  document.getElementById("voltar-guia").href = RUApp.linkComLead("/guia");

  const Q = RU.QUESTOES;
  const respostas = new Array(Q.length).fill(null);
  let passo = 0;
  let outroTexto = "";
  const tela = document.getElementById("tela");

  function esc(t) { return t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

  const ICONES = {
    contatos: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
    agenda: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    valor: '<path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2 2.6 5 3.2 5 1.4 5 3.3-2.2 3-5 3-5-1.1-5-3"/>',
    motivo: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
    retorno: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  };

  function quadro(info) {
    if (!info) return "";
    if (info.num) {
      const m = info.num.match(/^([\d.,]+)(.*)$/) || [null, info.num, ""];
      return `<div class="q-dado fade"><div class="q-num"><b>${esc(m[1])}</b><span>${esc(m[2])}</span></div><p>${esc(info.txt)}</p><span class="q-fonte">${esc(info.fonte)}</span></div>`;
    }
    return `<div class="q-dado fade"><div class="q-ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[info.icone] || ICONES.motivo}</svg><span>Por que perguntamos isso</span></div><p>${esc(info.txt)}</p></div>`;
  }

  function render() {
    const q = Q[passo];
    const restam = Math.max(1, Math.round((Q.length - passo) * 15 / 60));
    const segs = Q.map((_, i) => `<i class="${i < passo ? "ok" : i === passo ? "atual" : ""}"></i>`).join("");
    tela.innerHTML = `
      <div class="stack fade" style="gap:10px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap" class="small muted"><span>Pergunta ${passo + 1} de ${Q.length}</span><span>cerca de ${restam} min restante${restam > 1 ? "s" : ""}</span></div>
        <div class="segmentos" aria-hidden="true">${segs}</div>
      </div>
      <div class="sobre fade">${esc(q.etapa)}</div>
      <h1 class="fade" style="font-size:clamp(22px,4.4vw,30px)">${esc(q.p)}</h1>
      <p class="muted small fade">Responda de cabeça. Não precisa ser exato.</p>
      <div class="opcoes fade">${q.o.map((o, i) => {
        const naosei = o === "Não sei";
        return `<button type="button" class="opcao${naosei ? " nsei" : ""}${respostas[passo] === i ? " sel" : ""}" data-i="${i}">${esc(o)}${naosei ? '<small>tudo bem, isso também entra no diagnóstico</small>' : ""}</button>`;
      }).join("")}</div>
      <div class="campo fade" id="outro-box" hidden>
        <label for="outro">Qual é o motivo?</label>
        <input id="outro" maxlength="200" placeholder="Escreva em poucas palavras" value="${esc(outroTexto)}">
        <p class="erro" id="outro-erro" role="alert"></p>
        <button type="button" class="btn" id="outro-ok">Continuar</button>
      </div>
      ${quadro(q.info)}
      <div class="quiz-nav"><button type="button" class="btn btn-outline" id="voltar" ${passo === 0 ? "disabled" : ""}>Voltar</button></div>`;
    tela.querySelectorAll(".opcao").forEach((b) => b.addEventListener("click", () => escolher(Number(b.dataset.i))));
    document.getElementById("voltar").addEventListener("click", () => { if (passo > 0) { passo--; render(); } });
    window.scrollTo(0, 0);
  }

  function escolher(i) {
    const q = Q[passo];
    if (q.outro === i) { abrirOutro(i); return; }
    respostas[passo] = i;
    if (passo < Q.length - 1) { passo++; render(); }
    else finalizar();
  }

  function abrirOutro(i) {
    tela.querySelectorAll(".opcao").forEach((b) => b.classList.toggle("sel", Number(b.dataset.i) === i));
    const box = document.getElementById("outro-box");
    const campo = document.getElementById("outro");
    const erro = document.getElementById("outro-erro");
    box.hidden = false;
    campo.focus();
    campo.addEventListener("input", () => (erro.textContent = ""));
    document.getElementById("outro-ok").onclick = () => {
      const t = campo.value.trim();
      if (t.length < 3) { erro.textContent = "Escreva o motivo ou escolha outra opção."; return; }
      outroTexto = t;
      respostas[passo] = i;
      if (passo < Q.length - 1) { passo++; render(); } else finalizar();
    };
  }

  async function finalizar() {
    tela.innerHTML = `
      <div class="stack fade" style="flex:1;align-items:center;justify-content:center;text-align:center;gap:22px">
        <div class="spinner" aria-hidden="true"></div>
        <h1 style="font-size:clamp(22px,4.4vw,30px)">Montando o seu diagnóstico</h1>
        <p class="muted">Comparando suas respostas com a média do mercado.</p>
      </div>`;
    const faixa = RUApp.lerLocal("ru_faixa") || "";
    const r = RU.calcular(respostas, { faixa });
    const codigo = respostas.join("");
    const clinica = RUApp.lerLocal("ru_clinica") || "";
    const url = new URL("/resultado", location.origin);
    url.searchParams.set("r", codigo);
    if (clinica) url.searchParams.set("n", clinica);
    const fi = Object.keys(RU.FAIXAS).indexOf(faixa);
    if (fi >= 0) url.searchParams.set("f", String(fi));

    // A captura não foi gravada antes: tenta de novo com os dados guardados no aparelho.
    if (!leadId) {
      const pendente = RUApp.lerLocal("ru_pendente");
      if (pendente) {
        try {
          const rc = await fetch("/api/captura", { method: "POST", headers: { "Content-Type": "application/json" }, body: pendente });
          if (rc.ok) leadId = (await rc.json()).lead || "";
        } catch (err) {}
        if (leadId) { RUApp.gravarLocal("ru_lead", leadId); RUApp.gravarLocal("ru_pendente", ""); }
      }
    }

    const envio = !leadId ? Promise.resolve() : fetch("/api/quiz", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        lead: leadId,
        etapa: r.notionEtapa,
        estimativa: r.estimativa !== null ? Math.round(r.estimativa) : null,
        respostas: RU.respostasTexto(respostas, Q[6].outro === respostas[6] ? outroTexto : ""),
        resultado: url.toString(),
      }),
    }).catch(() => {});
    await Promise.all([envio, new Promise((ok) => setTimeout(ok, 2000))]);
    if (leadId) url.searchParams.set("l", leadId);
    location.href = url.pathname + url.search;
  }

  render();
})();
</script>
</body>
</html>
