<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Mini diagnóstico | RiseUp Odonto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Poppins:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topo"><div class="wrap"><a class="logo" href="/guia" id="link-guia"><img class="logo-full" src="/assets/logo.png" alt="RiseUp Odonto" width="138" height="40"><img class="logo-simb" src="/assets/simbolo.png" alt="RiseUp Odonto" width="34" height="34"></a><span class="small muted" id="data"></span></div></header>

<main id="conteudo"></main>

<footer class="rodape"><div class="wrap">Estimativa calculada apenas com os dados informados por você. Não é promessa de resultado. · RiseUp Odonto</div></footer>

<script src="/assets/config.js"></script>
<script src="/assets/calc.js"></script>
<script src="/assets/app.js"></script>
<script>
(function () {
  const p = RUApp.params;
  RUApp.lead();
  document.getElementById("link-guia").href = RUApp.linkComLead("/guia");
  document.getElementById("data").textContent = new Date().toLocaleDateString("pt-BR");
  const main = document.getElementById("conteudo");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const a = (p.get("r") || "").split("").map(Number);
  if (!RU.validar(a)) {
    main.innerHTML = `<section class="secao"><div class="wrap stack"><h1>Resultado não encontrado</h1><p class="muted">O link parece incompleto. Refaça o diagnóstico para ver o seu resultado.</p><a class="btn" href="${RUApp.linkComLead("/quiz")}">Fazer o diagnóstico</a></div></section>`;
    return;
  }

  const r = RU.calcular(a);
  const etapa = RU.ETAPAS[r.etapa];
  const clinica = (p.get("n") || "").slice(0, 120);
  const titulo = r.naoMede ? `Sua clínica <span class="destaque">não mede o funil</span>` : `Sua etapa mais fraca: <span class="destaque">${esc(etapa.nome)}</span>`;
  const explicacao = r.naoMede ? RU.NAO_MEDE.explicacao : etapa.explicacao;

  let estimativa = "";
  if (r.estimativa !== null) {
    const k = Math.round(r.estimativa / 1000);
    estimativa = `
      <div class="estimativa">
        <span class="small" style="color:#e3e9e9">Estimativa com os seus números</span>
        <div class="num">${k < 1 ? "Menos de R$ 1 mil" : `Cerca de R$ <span id="contador" data-alvo="${k}">0</span> mil`} <small>por mês</small></div>
        <span style="color:#e3e9e9;font-size:15px">${({
          fechamento: "É quanto representa fechar 1 orçamento a mais a cada 10 apresentados.",
          agendamento: "É quanto representa agendar 1 avaliação a mais a cada 10 contatos.",
          comparecimento: "É quanto representa 1 paciente a mais comparecer a cada 10 agendados.",
        })[r.ranking.find((x) => x.valor === r.estimativa).chave]}</span>
      </div>`;
  } else if (!r.naoMede) {
    estimativa = `<div class="alerta">Sem a estimativa em reais: para calcular, é preciso responder o volume de contatos, as três taxas e o valor médio do tratamento.</div>`;
  }

  let funil = "";
  if (r.funil) {
    const max = r.funil[0].n || 1;
    const pior = r.naoMede ? -1 : ({ primeira: 1, agendamento: 1, comparecimento: 2, orcamento: 3, fechamento: 3, retorno: 3 })[r.etapa];
    funil = `
      <div class="stack reveal" style="gap:12px">
        <h3>Seu funil hoje</h3>
        <div class="funil">${r.funil.map((f, i) => `
          <div class="row"><div class="rot"><span>${f.rotulo}</span><span>${f.n.toLocaleString("pt-BR")}</span></div>
          <div class="trilho"><i class="${i === pior ? "fraco" : ""}" style="--w:${Math.max(2, (f.n / max) * 100)}%;transition-delay:${i * 0.3}s"></i></div></div>`).join("")}
        </div>
        <p class="small muted">Valores aproximados, a partir das faixas que você marcou.</p>
      </div>`;
  }

  let ranking = "";
  if (r.ranking.length) {
    const max = r.ranking[0].valor || 1;
    ranking = `
      <div class="card reveal" style="background:var(--cinza-fundo)">
        <h3>Onde melhorar 1 em cada 10 rende mais</h3>
        <div class="funil" style="margin-top:10px">${r.ranking.map((x, i) => `
          <div class="row"><div class="rot"><span${i === 0 ? ' style="font-weight:500"' : ""}>${x.nome}</span><span>${RU.texto(x.valor).replace("cerca de ", "")}</span></div>
          <div class="trilho"><i class="${i === 0 ? "fraco" : ""}" style="--w:${Math.max(3, (x.valor / max) * 100)}%;transition-delay:${0.4 + i * 0.25}s"></i></div></div>`).join("")}
        </div>
      </div>`;
  }

  const naoAvaliadas = r.naoAvaliadas.length && !r.naoMede ? `<p class="small muted">Não avaliada por falta de resposta: ${r.naoAvaliadas.join(", ")}.</p>` : "";

  const alertas = r.alertas.length ? `
    <div class="stack" style="gap:10px">
      <h3>Pontos de atenção</h3>
      <div class="stack stagger" style="gap:10px">${r.alertas.map((x, i) => `<div class="alerta" style="animation-delay:${1 + i * 0.3}s"><strong>${x[0]}</strong> ${x[1]}</div>`).join("")}</div>
    </div>` : "";

  main.innerHTML = `
    <section class="secao">
      <div class="wrap stack" style="gap:22px">
        <div class="sobre">Mini diagnóstico${clinica ? " · " + esc(clinica) : ""}</div>
        <h1>${titulo}</h1>
        <p class="muted">${esc(explicacao)}</p>
        ${estimativa}
        ${funil}
        ${naoAvaliadas}
        ${ranking}
        ${alertas}
      </div>
    </section>
    <section class="secao cinza">
      <div class="wrap stack">
        <div class="sobre">Liberado para você</div>
        <h2>${esc(etapa.ferramenta)}</h2>
        <div>${etapa.html}</div>
        <button type="button" class="btn btn-outline no-print" id="pdf">Baixar em PDF</button>
      </div>
    </section>
    <section class="secao escuro">
      <div class="wrap stack">
        <h2>Quer entender esse resultado e montar o <span class="destaque">plano de correção</span>?</h2>
        <p style="color:#e3e9e9">Diagnóstico gratuito em reunião, partindo dos números que você informou.</p>
        <a class="btn btn-full" href="${RU_CONFIG.agendaUrl}" target="_blank" rel="noopener">Agendar diagnóstico gratuito</a>
      </div>
    </section>`;

  RUApp.ativarCopiar(main);
  RUApp.revelar();
  const pl = document.getElementById("baixar-planilha");
  if (pl) pl.addEventListener("click", RUApp.baixarPlanilha);
  document.getElementById("pdf").addEventListener("click", () => window.print());

  const c = document.getElementById("contador");
  if (c) {
    const alvo = Number(c.dataset.alvo);
    const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduz) c.textContent = alvo.toLocaleString("pt-BR");
    else {
      const t0 = performance.now();
      const dur = 1400;
      const passo = (t) => {
        const f = Math.min(1, (t - t0) / dur);
        c.textContent = Math.round(alvo * (1 - Math.pow(1 - f, 3))).toLocaleString("pt-BR");
        if (f < 1) requestAnimationFrame(passo);
      };
      requestAnimationFrame(passo);
    }
  }
})();
</script>
</body>
</html>
