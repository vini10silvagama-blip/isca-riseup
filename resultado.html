<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Mini diagnóstico | RiseUp Odonto</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Poppins:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="res">
<header class="topo"><div class="wrap"><a class="logo" href="/guia" id="link-guia"><img class="logo-full" src="/assets/logo.png" alt="RiseUp Odonto" width="138" height="40"><img class="logo-simb" src="/assets/simbolo.png" alt="RiseUp Odonto" width="34" height="34"></a><span class="small muted" id="data"></span></div></header>

<main id="conteudo"></main>

<script src="/assets/config.js"></script>
<script src="/assets/calc.js"></script>
<script src="/assets/app.js"></script>
<script>
(function () {
  const p = RUApp.params;
  const leadId = RUApp.lead();
  document.getElementById("link-guia").href = RUApp.linkComLead("/guia");
  document.getElementById("data").textContent = new Date().toLocaleDateString("pt-BR");
  const main = document.getElementById("conteudo");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const a = (p.get("r") || "").split("").map(Number);
  if (!RU.validar(a)) {
    main.innerHTML = `<section class="secao"><div class="wrap stack"><h1>Resultado não encontrado</h1><p class="muted">O link parece incompleto. Refaça o diagnóstico para ver o seu resultado.</p><a class="btn" href="${RUApp.linkComLead("/quiz")}">Fazer o diagnóstico</a></div></section>`;
    return;
  }

  const faixas = Object.keys(RU.FAIXAS);
  const faixa = faixas[Number(p.get("f"))] || RUApp.lerLocal("ru_faixa") || "";
  const r = RU.calcular(a, { faixa });
  const clinica = (p.get("n") || RUApp.lerLocal("ru_clinica") || "").slice(0, 120);
  const k = (v) => Math.round(v / 1000);
  const nomeEtapa = r.naoMede ? "Não mede o funil" : r.etapaNome;

  const fmt = (v) => k(v).toLocaleString("pt-BR");
  const ICO = {
    cadeado: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  };

  // 1. Abertura
  const abertura = `
    <section class="wrap topo-res entra">
      <div class="sobre">Mini diagnóstico</div>
      <h1>${clinica ? `Diagnóstico da <span class="destaque">${esc(clinica)}</span>` : `Seu <span class="destaque">diagnóstico</span>`}</h1>
    </section>`;

  // 2. Nota do funil
  const arco = Math.round(251 * r.nota / 100);
  const chipsNota = [["critico", "Crítico"], ["atencao", "Atenção"], ["ok", "Ok"], ["nao", "Não medido"]]
    .filter(([c]) => r.contagem[c]).map(([c, t]) => `<span class="sit s-${c}">${t} · ${r.contagem[c]}</span>`).join("");
  const nota = `
    <section class="wrap">
      <div class="nota-card reveal">
        <span class="brilho" aria-hidden="true"></span>
        <span class="p-rot c">NOTA DO FUNIL</span>
        <svg class="medidor" viewBox="0 0 200 118" role="img" aria-label="Nota do funil: ${r.nota} de 100">
          <path d="M 20 100 A 80 80 0 0 1 180 100" class="med-fundo"></path>
          <path d="M 20 100 A 80 80 0 0 1 180 100" class="med-arco" style="--d:${arco}"></path>
          <text x="100" y="88" text-anchor="middle" class="med-num">${r.nota}</text>
          <text x="100" y="110" text-anchor="middle" class="med-leg">de 100</text>
        </svg>
        <p>${esc(r.notaTexto.charAt(0).toUpperCase() + r.notaTexto.slice(1))}</p>
        <div class="sits">${chipsNota}</div>
      </div>
    </section>`;

  // 3. Quanto está na mesa
  let painel;
  const ganho = r.modo === "top" ? r.ganhoTop : r.estimativa;
  if (r.hoje !== null && ganho > 0) {
    const aumento = ganho / r.hoje;
    const offset = Math.round(302 * (1 - Math.min(aumento, 1)));
    const quebra = r.modo === "top" ? "" : [["Só o agendamento", r.ganhoAg], ["Só o comparecimento", r.ganhoComp], ["Só o fechamento", r.ganhoFech]]
      .filter((x) => x[1] > 500).map((x) => `<div><span>${x[0]}</span><b>+ R$ ${fmt(x[1])} mil/mês</b></div>`).join("");
    painel = `
      <div class="painel reveal">
        <span class="brilho" aria-hidden="true"></span>
        <span class="p-rot c">${r.modo === "top" ? "CHEGANDO AO NÍVEL DAS MELHORES CLÍNICAS NO FECHAMENTO" : "CHEGANDO À MÉDIA DO MERCADO"}</span>
        <div class="p-linha">
          <svg class="anel" viewBox="0 0 110 110" role="img" aria-label="Faturamento ${Math.round(aumento * 100)}% maior">
            <circle cx="55" cy="55" r="48" class="anel-fundo"></circle>
            <circle cx="55" cy="55" r="48" class="anel-arco" style="--off:${offset}" transform="rotate(-90 55 55)"></circle>
            <text x="55" y="53" text-anchor="middle" class="anel-num">+${Math.round(aumento * 100)}%</text>
            <text x="55" y="71" text-anchor="middle" class="anel-leg">faturamento</text>
          </svg>
          <div class="p-nums">
            <b class="p-mes">+R$ <span class="contar" data-alvo="${k(ganho)}">${fmt(ganho)}</span> mil</b>
            <small>por mês</small>
            <b class="p-ano">R$ <span class="contar" data-alvo="${k(ganho * 12)}">${fmt(ganho * 12)}</span> mil por ano</b>
          </div>
        </div>
        <div class="p-tiles"><div><small>Hoje</small><b>R$ ${fmt(r.hoje)} mil/mês</b></div><div><small>${r.modo === "top" ? "No nível das melhores" : "Na média"}</small><b class="c">R$ ${fmt(r.hoje + ganho)} mil/mês</b></div></div>
        ${quebra ? `<div class="p-quebra">${quebra}</div>` : ""}
        <small class="p-nota">Calculado só com os números que você informou${r.estimadas.length ? `; ${r.estimadas.join(" e ").toLowerCase()} estimado${r.estimadas.length > 1 ? "s" : ""} pela média do mercado` : ""}. Não é promessa de resultado.</small>
      </div>`;
  } else if (r.hoje !== null) {
    painel = `<div class="painel reveal"><span class="brilho" aria-hidden="true"></span><span class="p-rot c">ESTIMATIVA EM REAIS</span><p style="color:#e3e9e9">Nas taxas que você informou, o funil já está na média do mercado ou acima. O ganho agora está nos detalhes de cada etapa, que só aparecem com os números internos da clínica.</p></div>`;
  } else {
    painel = `<div class="painel reveal"><span class="brilho" aria-hidden="true"></span><span class="p-rot c">ESTIMATIVA EM REAIS</span><p style="color:#e3e9e9">Para calcular em reais, é preciso responder o volume de contatos, quantos agendam e o valor médio do tratamento. Na reunião, fazemos essa conta com os números da clínica.</p></div>`;
  }
  const mesa = `
    <section class="wrap bloco">
      <h2>Quanto está na mesa</h2>
      ${painel}
      ${r.cruzamento ? `<div class="cartao-cinza reveal"><span class="sobre">Um detalhe nos seus números</span><p>${esc(r.cruzamento)}</p></div>` : ""}
    </section>`;

  // 4. As 6 etapas
  const fraca = { primeira: "primeira", agendamento: "agendamento", comparecimento: "comparecimento", orcamento: "orcamento", fechamento: "fechamento", retorno: "retorno" }[r.etapa];
  const etapas = `
    <section class="wrap bloco">
      <h2>As 6 etapas da sua clínica</h2>
      <div class="legenda"><span><i class="lg-media"></i>Média do mercado</span><span><i class="lg-top"></i>Melhores clínicas</span></div>
      <div class="etapas6">${r.status.map((s, i) => `
        <div class="e6 reveal${s.chave === fraca ? " fraca" : ""}" style="transition-delay:${(i % 2) * 0.08}s">
          <div class="e6-topo"><span class="e6-n">${i + 1}</span><b>${s.nome}</b><span class="sit s-${s.s}">${s.situacao}</span></div>
          <span class="e6-leitura">${esc(s.leitura)}${s.chave === fraca ? ' · <strong>sua etapa mais fraca</strong>' : ""}</span>
          ${s.valor !== undefined && s.valor !== null ? `
          <div class="trilho2"><i class="c-${s.s === "critico" ? "laranja" : "ciano"}" style="--w:${Math.round(s.valor * 100)}%"></i><em class="m-media" style="left:${Math.round(s.media * 100)}%"></em>${s.top ? `<em class="m-top" style="left:${Math.round(s.top * 100)}%"></em>` : ""}</div>
          <small class="e6-ref">Média ${RU.pct(s.media)}${s.top ? ` · melhores ${RU.pct(s.top)}` : ""}</small>` : ""}
          <p><b>O que acontece:</b> ${esc(s.problema)}</p>
          <p><b class="t-ce">O que fazer:</b> ${esc(s.fazer)}</p>
        </div>`).join("")}
      </div>
    </section>`;

  // 5. Etapa mais fraca em detalhe
  const sem = r.semana;
  const d = r.detalhe;
  const kpis = d ? `
    <div class="kpis">
      <div><small>${d.rotulo}</small><b>${d.n.toLocaleString("pt-BR")}</b></div>
      <div class="esc"><small>${d.custo ? d.custoRot : "Sua taxa · média"}</small><b>${d.custo ? `+R$ ${fmt(d.custo)} mil/mês` : `${RU.pct(d.taxa)} · ${RU.pct(d.media)}`}</b></div>
    </div>` : "";
  const chat = sem.chat ? `
    <div class="wa2">
      <div class="wa2-topo"><span class="av">A</span><div><b>Ana · paciente</b><small>online</small></div></div>
      <div class="wa2-corpo">${sem.chat.map((m) => m[0] === "d"
        ? `<span class="dia">${esc(m[1])}</span>`
        : `<div class="m ${m[0]}"><span>${esc(m[1])}</span><small>${m[2]}${m[0] === "c" ? ' <svg viewBox="0 0 16 11" aria-hidden="true"><path d="M1 6l3 3 6-7M6 9l1 1 7-8"/></svg>' : ""}</small></div>`).join("")}
      </div>
    </div>` : `
    <div class="tabela-semana">${["Contatos novos", "Agendaram", "Compareceram", "Fecharam"].map((t) => `<div><span>${t}</span><b>__</b></div>`).join("")}</div>`;
  const detalhe = `
    <section class="secao cinza">
      <div class="wrap stack reveal">
        <div class="sobre">${r.naoMede ? "O principal achado" : "Sua etapa mais fraca"}</div>
        <h2>${esc(nomeEtapa)}</h2>
        <p class="muted">${esc(r.abertura)}</p>
        ${kpis}
        <div class="semana-card">
          <span class="sobre">O que fazer esta semana</span>
          <b class="semana-tit">${esc(sem.titulo)}</b>
          <p class="muted small">${esc(sem.texto)}</p>
          ${chat}
          <button type="button" class="btn btn-outline" id="copiar-semana">Copiar a mensagem</button>
        </div>
      </div>
    </section>`;

  // 6. O que só os números reais mostram
  const trancados = [
    ["Orçamentos parados", "Quantos existem hoje e quanto valem em tratamentos."],
    ["Origem dos pacientes que fecham", "De onde vêm os contatos que viram tratamento e os que só custam."],
    ["Custo de cada paciente novo", "Quanto a clínica investe para cada paciente que chega à cadeira."],
  ];
  const reais = `
    <section class="wrap bloco fim">
      <h2>O que só os números reais da clínica mostram</h2>
      <p class="muted">O diagnóstico de fora vai até aqui. Estas respostas aparecem na reunião, com os dados da clínica.</p>
      <div class="stack" style="gap:10px">${trancados.map((t, i) => `
        <div class="tranca reveal" style="transition-delay:${i * 0.1}s"><span class="tranca-ico">${ICO.cadeado}</span><div><b>${t[0]}</b><p>${t[1]}</p><span class="borrao" aria-hidden="true"><i></i><i></i></span></div></div>`).join("")}
      </div>
    </section>`;

  // 7. CTA
  const agenda = RU_CONFIG.agendaUrl(clinica, nomeEtapa);
  const cta = `
    <section class="secao escuro cta-final">
      <span class="circ" aria-hidden="true"></span>
      <div class="wrap stack">
        <h2>Vamos aprofundar o diagnóstico ${clinica ? `da <span class="destaque">${esc(clinica)}</span>` : `da <span class="destaque">sua clínica</span>`}?</h2>
        <p style="color:#e3e9e9">Na reunião, analisamos com você cada etapa do atendimento da clínica, encontramos a causa de cada perda e, no final, apresentamos um caminho para corrigir.</p>
        <a class="btn btn-full" href="${esc(agenda)}" target="_blank" rel="noopener">Quero aprofundar meu diagnóstico</a>
        <button type="button" class="btn btn-outline btn-full" id="pedir-relatorio">Receber o relatório completo no WhatsApp</button>
        <p class="small" id="relatorio-status" style="color:#b9c4c4;text-align:center" role="status">O relatório em PDF chega em até 1 dia útil.</p>
      </div>
    </section>
    <footer class="rodape"><div class="wrap stack" style="gap:4px">
      <b style="color:var(--preto);font-weight:500">Fontes das referências</b>
      <span>Agendamento: Liine, Dentistry Marketing Benchmark Report 2024 (quase 50 mil contatos de clínicas nos EUA).</span>
      <span>Comparecimento: revisão científica sobre faltas em consultas de saúde (2018).</span>
      <span>Fechamento: Henry Schein One, 2026 Catalyst Index (consultórios nos EUA).</span>
      <span>Tempo de resposta: Harvard Business Review (2011).</span>
      <span>Estimativa calculada só com os dados informados por você. Não é promessa de resultado. · RiseUp Odonto</span>
    </div></footer>`;

  main.innerHTML = abertura + nota + mesa + etapas + detalhe + reais + cta;

  RUApp.revelar();

  // Números que contam ao aparecer
  const contar = (el) => {
    const alvo = Number(el.dataset.alvo);
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t0 = performance.now();
    const passo = (t) => {
      const f = Math.min(1, (t - t0) / 1400);
      el.textContent = Math.round(alvo * (1 - Math.pow(1 - f, 3))).toLocaleString("pt-BR");
      if (f < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  };
  document.querySelectorAll(".contar").forEach(contar);

  document.getElementById("copiar-semana").addEventListener("click", async (ev) => {
    try { await navigator.clipboard.writeText(sem.copiar); } catch (e) {}
    ev.target.textContent = "Mensagem copiada";
    setTimeout(() => (ev.target.textContent = "Copiar a mensagem"), 1600);
  });

  const pedir = document.getElementById("pedir-relatorio");
  const status = document.getElementById("relatorio-status");
  pedir.addEventListener("click", async () => {
    pedir.disabled = true;
    let ok = false;
    if (leadId) {
      try {
        const relatorio = new URL("/relatorio", location.origin);
        ["r", "n", "f"].forEach((c) => { if (p.get(c)) relatorio.searchParams.set(c, p.get(c)); });
        const resp = await fetch("/api/relatorio", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ lead: leadId, relatorio: relatorio.toString() }) });
        ok = resp.ok;
      } catch (e) {}
    }
    if (ok) {
      pedir.textContent = "Pedido recebido";
      status.textContent = "Pronto! O relatório completo chega no seu WhatsApp em até 1 dia útil.";
    } else {
      const t = `Olá! Fiz o diagnóstico${clinica ? " da " + clinica : ""} e quero receber o relatório completo.`;
      window.open(`https://wa.me/${RU_CONFIG.whatsappAgenda}?text=${encodeURIComponent(t)}`, "_blank", "noopener");
      pedir.disabled = false;
    }
  });
})();
</script>
</body>
</html>
